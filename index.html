<style>
:root {
  --dark:       #3a3d2e;
  --dark-deep:  #2b2e20;
  --dark-mid:   #44473a;
  --gold:       #C8A84B;
  --gold-light: #e0c060;
  --gold-dim:   rgba(200,168,75,0.13);
  --gold-border:rgba(200,168,75,0.35);
  --cream:      #FEF8EA;
  --cream-dark: #f0e8d0;
  --white:      #FFFFFF;
  --text:       #2b2e20;
  --text-mid:   #4a4d3a;
  --text-soft:  #7a7d6a;
  --border:     rgba(43,46,32,0.13);
  --card:       #FFFFFF;
  --success:    #2e7d4f;
  --warning:    #b07d10;
  --danger:     #b03030;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:var(--dark-deep);border-bottom:3px solid var(--gold);padding:0 32px;padding-left:max(32px,env(safe-area-inset-left));padding-right:max(32px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;height:68px;box-shadow:0 4px 20px rgba(43,46,32,0.35);}
.logo{display:flex;align-items:center;gap:14px;}
.logo-img{width:46px;height:46px;border-radius:8px;object-fit:cover;box-shadow:0 0 0 2px var(--gold);}
.logo-text{font-family:'Bebas Neue';font-size:24px;letter-spacing:3px;color:var(--gold);line-height:1;}
.logo-sub{font-size:10px;color:rgba(200,168,75,0.65);letter-spacing:3px;text-transform:uppercase;margin-top:1px;}
.header-date{font-family:'JetBrains Mono';font-size:12px;color:var(--gold);background:rgba(200,168,75,0.1);border:1px solid var(--gold-border);padding:6px 16px;border-radius:6px;}

/* NAV */
.nav{display:flex;padding:0 32px;background:var(--dark);border-bottom:1px solid rgba(200,168,75,0.2);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;}.nav::-webkit-scrollbar{display:none;}
.nav-btn{padding:13px 20px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;background:none;border:none;color:rgba(255,255,255,0.45);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all 0.2s;}
.nav-btn:hover{color:rgba(255,255,255,0.8);}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold);}

/* MAIN */
.main{padding:28px 32px;padding-bottom:max(28px,calc(env(safe-area-inset-bottom) + 16px));}

/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:10px;padding:20px;box-shadow:0 2px 10px rgba(43,46,32,0.08);transition:transform 0.2s,box-shadow 0.2s;}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(43,46,32,0.13);}
.stat-label{font-size:10px;color:var(--text-soft);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.stat-value{font-family:'Bebas Neue';font-size:40px;color:var(--text);line-height:1;}
.stat-value.gold{color:var(--gold);}
.stat-value.green{color:var(--success);}
.stat-value.red{color:var(--danger);}
.stat-sub{font-size:11px;color:var(--text-soft);margin-top:6px;}

/* SECTION */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.section-title{font-family:'Bebas Neue';font-size:24px;letter-spacing:2px;color:var(--text);}
.section-title span{color:var(--gold);}
.section-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* TOOLBAR */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.search-box{flex:1;min-width:200px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:'DM Sans';font-size:13px;outline:none;box-shadow:0 1px 4px rgba(43,46,32,0.06);transition:border-color 0.2s;}
.search-box::placeholder{color:var(--text-soft);}
.search-box:focus{border-color:var(--gold);}
.filter-btn{padding:9px 16px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text-soft);transition:all 0.2s;}
.filter-btn.active{background:var(--dark);color:var(--gold);border-color:var(--dark);}
.filter-btn:hover:not(.active){border-color:var(--gold);color:var(--gold);}

/* TABLE */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--border);box-shadow:0 2px 10px rgba(43,46,32,0.07);}
table{width:100%;border-collapse:collapse;background:#fff;}
thead tr{background:var(--dark-deep);}
thead th{padding:11px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);white-space:nowrap;}
tbody tr{border-top:1px solid rgba(43,46,32,0.07);transition:background 0.15s;}
tbody tr:hover{background:rgba(200,168,75,0.05);}
tbody tr.paused{opacity:0.38;}
tbody td{padding:11px 14px;font-size:13px;color:var(--text);white-space:nowrap;}
td.mono{font-family:'JetBrains Mono';font-size:12px;}
.totales-row{background:var(--cream)!important;}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.badge.active{background:rgba(46,125,79,0.1);color:var(--success);border:1px solid rgba(46,125,79,0.25);}
.badge.paused{background:rgba(176,48,48,0.09);color:var(--danger);border:1px solid rgba(176,48,48,0.22);}
.badge.green{background:rgba(46,125,79,0.1);color:var(--success);}
.badge.amber{background:rgba(176,125,16,0.1);color:var(--warning);}
.badge.red{background:rgba(176,48,48,0.09);color:var(--danger);}

/* KPI BAR */
.kpi-bar{display:flex;align-items:center;gap:8px;min-width:100px;}
.bar-track{flex:1;height:5px;background:var(--cream-dark);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width 0.6s ease;}
.bar-pct{font-family:'JetBrains Mono';font-size:11px;color:var(--text-mid);min-width:38px;text-align:right;font-weight:600;}

/* BUTTONS */
.action-btn{padding:5px 11px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:0.5px;cursor:pointer;border:1px solid transparent;transition:all 0.15s;}
.btn-pause{background:rgba(176,48,48,0.07);color:var(--danger);border-color:rgba(176,48,48,0.22);}
.btn-pause:hover{background:rgba(176,48,48,0.15);}
.btn-resume{background:rgba(46,125,79,0.08);color:var(--success);border-color:rgba(46,125,79,0.25);}
.btn-resume:hover{background:rgba(46,125,79,0.18);}
.btn-edit{background:var(--gold-dim);color:var(--dark);border-color:var(--gold-border);}
.btn-edit:hover{background:rgba(200,168,75,0.22);}
.btn-delete{background:rgba(176,48,48,0.06);color:var(--danger);border-color:rgba(176,48,48,0.2);}
.btn-delete:hover{background:rgba(176,48,48,0.14);}
.btn-add{padding:9px 18px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;background:var(--dark-deep);color:var(--gold);border:2px solid var(--gold-border);box-shadow:0 4px 14px rgba(43,46,32,0.2);transition:all 0.2s;}
.btn-add:hover{background:var(--dark);transform:translateY(-1px);}
.btn-import{padding:9px 18px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;background:linear-gradient(135deg,var(--gold),#a87d2a);color:var(--dark-deep);border:none;box-shadow:0 4px 14px rgba(200,168,75,0.3);transition:all 0.2s;}
.btn-import:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(200,168,75,0.4);}
.btn-primary{padding:10px 22px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:var(--dark-deep);color:var(--gold);border:2px solid var(--gold-border);transition:all 0.2s;}
.btn-primary:hover{background:var(--dark);}
.btn-confirm{padding:10px 22px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold),#a87d2a);color:var(--dark-deep);border:none;transition:all 0.2s;}
.btn-confirm:hover{opacity:0.9;}
.btn-secondary{padding:10px 22px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--text-soft);border:1px solid var(--border);transition:all 0.2s;}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(43,46,32,0.55);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(4px);animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--cream);border:1px solid var(--gold-border);border-top:4px solid var(--gold);border-radius:14px;padding:32px;width:540px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(43,46,32,0.3);animation:slideUp 0.25s ease;}
.modal-wide{width:880px;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-family:'Bebas Neue';font-size:24px;color:var(--dark-deep);margin-bottom:6px;letter-spacing:2px;}
.modal-sub{font-size:12px;color:var(--text-soft);margin-bottom:24px;}
.form-group{margin-bottom:18px;}
.form-label{font-size:11px;color:var(--text-soft);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;display:block;}
.form-input{width:100%;padding:11px 14px;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans';font-size:14px;outline:none;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--gold);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;}

/* PANEL */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
@media(max-width:900px){.grid2{grid-template-columns:1fr;}}
.panel{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:10px;padding:20px;box-shadow:0 2px 10px rgba(43,46,32,0.07);}
.panel-title{font-family:'Bebas Neue';font-size:16px;color:var(--dark-deep);letter-spacing:1.5px;margin-bottom:16px;}

/* IMPORT ZONE */
.import-zone{border:2px dashed var(--gold-border);border-radius:12px;padding:40px;text-align:center;background:var(--gold-dim);cursor:pointer;transition:all 0.2s;margin-bottom:20px;}
.import-zone:hover,.import-zone.drag{border-color:var(--gold);background:rgba(200,168,75,0.18);}
.import-zone-icon{font-size:40px;margin-bottom:12px;}
.import-zone-title{font-family:'Bebas Neue';font-size:20px;color:var(--dark);letter-spacing:1.5px;margin-bottom:6px;}
.import-zone-sub{font-size:12px;color:var(--text-soft);}

/* PREVIEW TABLE */
.preview-wrap{max-height:340px;overflow-y:auto;border-radius:10px;border:1px solid var(--border);}
.preview-wrap table tbody tr:hover{background:rgba(200,168,75,0.06);}

/* RESUMEN IMPORT */
.import-resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px;}
.import-chip{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;}
.import-chip-val{font-family:'Bebas Neue';font-size:28px;color:var(--text);}
.import-chip-val.green{color:var(--success);}
.import-chip-val.amber{color:var(--warning);}
.import-chip-val.red{color:var(--danger);}
.import-chip-val.gold{color:var(--gold);}
.import-chip-label{font-size:10px;color:var(--text-soft);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}

/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;z-index:9999;background:var(--dark-deep);border:2px solid var(--gold);border-radius:10px;padding:14px 20px;font-size:13px;font-weight:700;color:var(--gold);box-shadow:0 8px 30px rgba(43,46,32,0.4);animation:toastIn 0.3s ease;}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

.alerta-box{background:rgba(176,48,48,0.04);border:1px solid rgba(176,48,48,0.18);border-left:4px solid var(--danger);border-radius:10px;padding:20px;margin-bottom:24px;}
.alerta-title{font-family:'Bebas Neue';font-size:16px;color:var(--danger);letter-spacing:1.5px;margin-bottom:12px;}
.obs-box{margin-top:14px;padding:10px 14px;background:var(--gold-dim);border-radius:8px;border-left:3px solid var(--gold);font-size:12px;color:var(--text-mid);}
.empty-state{text-align:center;padding:40px;color:var(--text-soft);font-size:13px;}
/* ── PRINT / MANIFIESTO ─────────────────────────────────── */
@media print {
  body { background:#fff !important; }
  .no-print { display:none !important; }
  .print-only { display:block !important; }
  .manifiesto-page { page-break-after: always; }
}
.print-only { display:none; }
.manifiesto-modal-overlay {
  position:fixed;inset:0;background:rgba(43,46,32,0.6);
  display:flex;align-items:flex-start;justify-content:center;
  z-index:9999;backdrop-filter:blur(4px);padding:20px;
  overflow-y:auto;
}
.manifiesto-modal {
  background:#fff;border-radius:12px;
  width:860px;max-width:98vw;
  box-shadow:0 24px 60px rgba(0,0,0,0.4);
  animation:slideUp 0.25s ease;
  overflow:hidden;
}
.man-toolbar {
  background:var(--dark-deep);padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;position:relative;z-index:10000;
}
.man-toolbar-title {font-family:'Bebas Neue';font-size:18px;color:var(--gold);letter-spacing:2px;}
.man-toolbar-actions {display:flex;gap:8px;}
.btn-pdf {
  padding:9px 20px;border-radius:8px;font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),#a87d2a);
  color:var(--dark-deep);border:none;
  box-shadow:0 4px 14px rgba(200,168,75,0.35);transition:all 0.2s;
}
.btn-pdf:hover{transform:translateY(-1px);}
.man-filter-bar {
  background:var(--cream);border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.man-filter-bar label {font-size:11px;color:var(--text-soft);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.man-filter-bar select {
  padding:7px 12px;border-radius:7px;border:1px solid var(--border);
  background:#fff;color:var(--text);font-family:'DM Sans';font-size:13px;
  outline:none;cursor:pointer;
}
.man-filter-bar select:focus{border-color:var(--gold);}
.man-preview {padding:24px;background:#fff;max-height:70vh;overflow-y:auto;}

/* MANIFIESTO DOCUMENTO */
.man-doc {
  font-family:Arial,sans-serif;font-size:11px;color:#111;
  width:100%;
}
.man-header {
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;padding-bottom:12px;
  border-bottom:3px solid #C8A84B;
}
.man-header-logo {display:flex;align-items:center;gap:12px;}
.man-header-logo img {width:70px;height:70px;object-fit:contain;}
.man-header-brand {font-family:Arial,sans-serif;}
.man-header-brand .brand-name {font-size:22px;font-weight:900;color:#2b2e20;letter-spacing:2px;text-transform:uppercase;}
.man-header-brand .brand-sub {font-size:9px;color:#7a7d6a;letter-spacing:2px;text-transform:uppercase;}
.man-header-fecha {text-align:right;font-size:11px;color:#4a4d3a;font-weight:600;}
.man-header-fecha .fecha-big {font-size:13px;font-weight:700;color:#2b2e20;}
.man-body {display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;}
.man-table-wrap {flex:1;}
.man-table {width:100%;border-collapse:collapse;font-size:10px;}
.man-table thead tr {background:#2b2e20;}
.man-table thead th {color:#C8A84B;padding:7px 10px;text-align:left;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;}
.man-table tbody tr {border-bottom:1px solid #f0e8d0;}
.man-table tbody tr:nth-child(even){background:#fdf9f2;}
.man-table tbody td {padding:5px 10px;font-size:10px;}
.man-estado {
  display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;letter-spacing:0.5px;
}
.man-estado.entregado {background:rgba(46,125,79,0.12);color:#1a6b3a;}
.man-estado.cancelado {background:rgba(176,48,48,0.1);color:#8b1a1a;}
.man-estado.reprogramado {background:rgba(176,125,16,0.12);color:#7a5500;}
.man-estado.camino {background:rgba(200,168,75,0.15);color:#5a4010;}
.man-estado.pendiente {background:rgba(43,46,32,0.08);color:#4a4d3a;}

/* PANEL RESUMEN */
.man-resumen {min-width:280px;}
.man-kpi-table {
  width:100%;border-collapse:collapse;font-size:10px;margin-bottom:12px;
  border:1px solid #e0d8c0;border-radius:8px;overflow:hidden;
}
.man-kpi-table thead tr {background:#2b2e20;}
.man-kpi-table thead th {color:#C8A84B;padding:7px 10px;font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:700;text-align:center;}
.man-kpi-table tbody td {padding:7px 10px;text-align:center;border-bottom:1px solid #f0e8d0;font-weight:600;}
.man-kpi-table tbody tr:last-child td {border-bottom:none;}
.man-kpi-indicador {background:#2b2e20;color:#C8A84B;font-weight:900;font-size:14px;}
.man-summary-box {border:1px solid #e0d8c0;border-radius:8px;overflow:hidden;margin-bottom:12px;}
.man-summary-box .sum-header{background:#C8A84B;padding:7px 12px;font-size:9px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#2b2e20;}
.man-summary-box table {width:100%;border-collapse:collapse;}
.man-summary-box table td {padding:6px 12px;font-size:11px;border-bottom:1px solid #f0e8d0;}
.man-summary-box table td:last-child {text-align:right;font-weight:700;}
.man-summary-box table tr:last-child td {border-bottom:none;}
.man-footer {
  margin-top:18px;padding-top:10px;border-top:2px solid #C8A84B;
  display:flex;justify-content:space-between;align-items:center;
  font-size:9px;color:#7a7d6a;
}
.man-tipo-badge {
  display:inline-block;padding:4px 14px;border-radius:4px;
  font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
}
.man-tipo-badge.salida {background:#2b2e20;color:#C8A84B;}
.man-tipo-badge.cierre {background:#C8A84B;color:#2b2e20;}

/* PERFIL OPERADOR */
.perfil-screen{position:fixed;inset:0;background:var(--cream);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;}
.perfil-card{background:#fff;border:1px solid var(--border);border-top:4px solid var(--gold);border-radius:16px;padding:36px;width:560px;max-width:98vw;max-height:95dvh;overflow-y:auto;box-shadow:0 12px 40px rgba(43,46,32,0.15);}
.perfil-logo{display:flex;align-items:center;gap:14px;margin-bottom:28px;}
.perfil-logo img{width:52px;height:52px;border-radius:10px;object-fit:cover;box-shadow:0 0 0 2px var(--gold);}
.perfil-title{font-family:'Bebas Neue';font-size:28px;color:var(--dark-deep);letter-spacing:2px;line-height:1;}
.perfil-sub{font-size:11px;color:var(--text-soft);letter-spacing:2px;text-transform:uppercase;margin-top:3px;}
.men-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:8px;max-height:320px;overflow-y:auto;padding:2px;}
.men-chip{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--cream);cursor:pointer;transition:all 0.15s;user-select:none;}
.men-chip:hover{border-color:var(--gold);}
.men-chip.selected{background:rgba(200,168,75,0.12);border-color:var(--gold);}
.men-chip-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all 0.15s;}
.men-chip.selected .men-chip-check{background:var(--gold);border-color:var(--gold);color:var(--dark-deep);}
.men-chip-name{font-size:13px;font-weight:600;color:var(--text);}
.sel-actions{display:flex;gap:8px;margin-bottom:14px;}
.sel-link{font-size:12px;color:var(--gold);cursor:pointer;font-weight:600;text-decoration:underline;background:none;border:none;padding:0;}
.perfil-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:20px;font-size:11px;font-weight:700;color:var(--dark);letter-spacing:1px;cursor:pointer;transition:all 0.2s;margin-left:12px;}
.perfil-badge:hover{background:rgba(200,168,75,0.22);}
.header-right{display:flex;align-items:center;gap:8px;}
.btn-manifiesto{padding:7px 16px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;background:linear-gradient(135deg,var(--gold),#a87d2a);color:var(--dark-deep);border:none;box-shadow:0 3px 10px rgba(200,168,75,0.3);transition:all 0.2s;white-space:nowrap;}
.btn-manifiesto:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(200,168,75,0.4);}

.info-banner{background:rgba(200,168,75,0.1);border:1px solid var(--gold-border);border-left:4px solid var(--gold);border-radius:8px;padding:12px 16px;font-size:12px;color:var(--text-mid);margin-bottom:16px;}

/* EDIT INLINE */
.inline-input{width:70px;padding:5px 7px;background:var(--cream);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'JetBrains Mono';font-size:13px;text-align:center;outline:none;}
.inline-input:focus{border-color:var(--gold);}

/* PAGINACION */
.pagination{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px;}
.page-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-soft);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;}
.page-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
.page-btn.active{background:var(--dark-deep);color:var(--gold);border-color:var(--dark-deep);}
.page-btn:disabled{opacity:0.35;cursor:default;}
.page-info{font-size:12px;color:var(--text-soft);font-family:'JetBrains Mono';}

/* ═══════════════════════════════════════════════════════
   RESPONSIVE — Mobile / Tablet / Desktop
═══════════════════════════════════════════════════════ */

/* ── TABLET (≤900px) ─────────────────────────────────── */
@media(max-width:900px){
  .header{padding:0 16px;height:60px;}
  .logo-text{font-size:20px;}
  .logo-sub{display:none;}
  .header-date{display:none;}
  .header-right{gap:6px;}
  .btn-manifiesto{padding:6px 12px;font-size:10px;}
  .perfil-badge{padding:4px 10px;font-size:10px;}
  .nav{padding:0 8px;}
  .nav-btn{padding:11px 12px;font-size:10px;letter-spacing:1px;}
  .main{padding:16px;}
  .stats-grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
  .stat-value{font-size:32px;}
  .grid2{grid-template-columns:1fr;}
  .section-head{flex-direction:column;align-items:flex-start;}
  .form-row{grid-template-columns:1fr;}
  .modal{padding:20px;}
  .man-filter-bar{padding:10px 16px;gap:8px;}
  .man-preview{padding:16px;max-height:60vh;}
  .man-body{grid-template-columns:1fr;}
  .man-resumen{min-width:unset;}
}

/* ── MOBILE (≤600px) ─────────────────────────────────── */
@media(max-width:600px){
  .header{padding:0 12px;height:56px;}
  .logo-img{width:36px;height:36px;}
  .logo-text{font-size:18px;letter-spacing:2px;}
  .btn-manifiesto{font-size:10px;padding:5px 10px;letter-spacing:0.5px;}
  .perfil-badge{font-size:9px;padding:3px 8px;}

  /* NAV → scroll horizontal compacto */
  .nav{padding:0 4px;-webkit-overflow-scrolling:touch;}
  .nav-btn{padding:10px 10px;font-size:9px;letter-spacing:0.8px;}

  /* MAIN */
  .main{padding:12px;}

  /* STATS → 2 columnas en móvil */
  .stats-grid{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .stat-card{padding:14px 12px;}
  .stat-value{font-size:28px;}
  .stat-label{font-size:9px;letter-spacing:1px;}
  .stat-sub{font-size:10px;}

  /* SECTION */
  .section-title{font-size:20px;}
  .section-head{margin-bottom:14px;}

  /* TOOLBAR */
  .toolbar{gap:8px;}
  .search-box{min-width:0;font-size:14px;padding:10px 12px;}
  .filter-btn{padding:8px 12px;font-size:10px;}

  /* TABLAS → scroll horizontal con font más chico */
  .table-wrap{border-radius:8px;}
  thead th{padding:9px 10px;font-size:9px;letter-spacing:1px;}
  tbody td{padding:9px 10px;font-size:12px;}
  td.mono{font-size:11px;}
  .kpi-bar{min-width:100px;}
  .bar-pct{font-size:10px;min-width:32px;}
  .action-btn{padding:4px 9px;font-size:10px;}

  /* MODALES */
  .modal{padding:16px;border-radius:10px;}
  .modal-title{font-size:20px;}
  .form-input{font-size:16px;} /* evita zoom en iOS */
  .modal-actions{flex-direction:column;}
  .modal-actions button{width:100%;}
  .btn-primary,.btn-secondary,.btn-confirm{padding:12px;font-size:14px;}

  /* PANEL */
  .panel{padding:14px;}
  .panel-title{font-size:14px;}

  /* IMPORT ZONE */
  .import-zone{padding:24px 16px;}
  .import-zone-title{font-size:16px;}
  .import-resumen{grid-template-columns:repeat(3,1fr);gap:8px;}
  .import-chip{padding:8px;}
  .import-chip-val{font-size:22px;}
  .import-chip-label{font-size:9px;}
  .preview-wrap{max-height:260px;}
  .inline-input{width:56px;padding:4px 5px;font-size:12px;}

  /* PERFIL SELECTOR */
  .perfil-card{padding:20px 16px;}
  .men-grid{grid-template-columns:1fr 1fr;max-height:260px;}
  .men-chip{padding:8px 10px;}
  .men-chip-name{font-size:11px;}

  /* MANIFIESTO */
  .manifiesto-modal-overlay{padding:8px;}
  .man-toolbar{padding:12px 14px;}
  .man-toolbar-title{font-size:15px;}
  .man-filter-bar{flex-direction:column;align-items:flex-start;padding:10px 12px;gap:6px;}
  .man-filter-bar select{width:100%;}
  .man-preview{padding:10px;max-height:55vh;}
  .man-body{grid-template-columns:1fr;}
  .man-header{flex-direction:column;gap:10px;align-items:flex-start;}
  .man-header-fecha{text-align:left;}
  .man-header-logo img{width:50px;height:50px;}
  .man-toolbar-actions{width:100%;}
  .man-toolbar-actions button{flex:1;}

  /* TOAST */
  .toast{bottom:16px;right:12px;left:12px;text-align:center;font-size:12px;}

  /* ALERTA */
  .alerta-box{padding:14px;}

  /* INFO BANNER */
  .info-banner{font-size:11px;}

  /* PAGINACION */
  .pagination{gap:4px;flex-wrap:wrap;}
  .page-btn{padding:5px 10px;font-size:11px;}
}

/* ── MÓVIL MUY PEQUEÑO (≤380px — iPhone SE etc) ──────── */
@media(max-width:380px){
  .stats-grid{grid-template-columns:1fr 1fr;}
  .stat-value{font-size:24px;}
  .men-grid{grid-template-columns:1fr;}
  .nav-btn{padding:9px 8px;font-size:9px;}
  .import-resumen{grid-template-columns:repeat(2,1fr);}
  .header{height:52px;}
  .logo-img{width:32px;height:32px;}
  .logo-text{font-size:16px;}
}

/* ── TABLETS LANDSCAPE / DESKTOP PEQUEÑO (600-900px) ─── */
@media(min-width:601px) and (max-width:900px){
  .stats-grid{grid-template-columns:repeat(3,1fr);}
  .men-grid{grid-template-columns:repeat(3,1fr);}
  .import-resumen{grid-template-columns:repeat(4,1fr);}
}

/* ── TOUCH: agrandar targets táctiles ───────────────────*/
@media(hover:none) and (pointer:coarse){
  .nav-btn{min-height:44px;}
  .action-btn{min-height:36px;padding:6px 12px;}
  .filter-btn{min-height:40px;}
  .men-chip{min-height:44px;}
  .btn-add,.btn-primary,.btn-confirm,.btn-secondary{min-height:44px;}
  .form-input,.search-box{min-height:44px;font-size:16px;}
  select{min-height:44px;font-size:16px;}
}


/* ── LOGIN ───────────────────────────────────────────────────────── */
@keyframes pulse {
  0%,100%{ opacity:1; transform:scale(1); }
  50%{ opacity:0.5; transform:scale(1.3); }
}
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-box-shadow: 0 0 0px 1000px rgba(255,255,255,0.06) inset !important;
  -webkit-text-fill-color: #fff !important;
  caret-color: #fff;
}

    @keyframes scan-line {
      0% { top: 10%; opacity: 1; }
      50% { top: 90%; opacity: 0.6; }
      100% { top: 10%; opacity: 1; }
    }

function parsearPDFFlex(texto,clienteSeleccionado){
  // Separar páginas por form-feed
  const paginas=texto.split('\f').map(p=>p.trim()).filter(p=>p.length>20);
  const hoy=new Date().toISOString().slice(0,10);
  const envios=[];
  paginas.forEach((pagina,idx)=>{
    const lineas=pagina.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
    let codigo='',destinatario='',direccion='',referencia='',comuna='',fecha=hoy,zona='';
    lineas.forEach((l,i)=>{
      // Código de envío: "Envio: 4723828 3907" → "47238283907"
      if(/^Envio:/i.test(l)){
        codigo=l.replace(/^Envio:/i,'').trim().replace(/\s+/g,'');
      }
      // Fecha: "06 JUN" o "FLEX  06 JUN"
      const mFecha=l.match(/(\d{2})\s+(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)/i);
      if(mFecha){
        const meses={ENE:'01',FEB:'02',MAR:'03',ABR:'04',MAY:'05',JUN:'06',JUL:'07',AGO:'08',SEP:'09',OCT:'10',NOV:'11',DIC:'12'};
        const anio=new Date().getFullYear();
        fecha=`${anio}-${meses[mFecha[2].toUpperCase()]}-${mFecha[1]}`;
      }
      // Zona: ANILLO ESTE / ANILLO OESTE
      if(/^ANILLO/i.test(l))zona=l;
      // Comuna: línea después de ANILLO (si la anterior era ANILLO)
      if(i>0&&/^ANILLO/i.test(lineas[i-1]))comuna=l.toUpperCase();
      // Dirección
      if(/^Direcci[oó]n:/i.test(l)){
        direccion=l.replace(/^Direcci[oó]n:/i,'').trim();
        // Puede continuarse en siguiente línea sin keyword
      }
      // Referencia
      if(/^Referencia:/i.test(l)){
        referencia=l.replace(/^Referencia:/i,'').trim().replace(/^Referencia:/i,'').trim();
        // Puede haber línea continuación
        if(i+1<lineas.length&&!/^(Destinatario|FLEX|ANILLO|Direcci)/i.test(lineas[i+1])){
          referencia+=' '+lineas[i+1];
        }
      }
      // Destinatario
      if(/^Destinatario:/i.test(l)){
        // "Destinatario: Nombre Apellido (RUT/CODE)"
        const raw=l.replace(/^Destinatario:/i,'').trim();
        // Extraer nombre sin el código entre paréntesis
        destinatario=raw.replace(/\([^)]*\)/,'').trim()||raw;
      }
    });
    if(!codigo)return; // Saltear página sin código
    envios.push({
      id:Date.now()+idx,
      codigo,
      cliente:clienteSeleccionado,
      destinatario,
      direccion,
      referencia,
      comuna,
      zona,
      telefono:'',
      fecha,
      estado:'sin_asignar',
      mensajero:'',
      monto:0,
      nota:referencia?'Ref: '+referencia:'',
      fuente:'externo',
      historial:[{fecha:new Date().toISOString(),estado:'sin_asignar',nota:'Importado desde PDF Flex · '+clienteSeleccionado}]
    });
  });
  return envios;
}

function playSound(type){try{
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const now=ctx.currentTime;
  // Master compressor para que suene pleno y no distorsione
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-12; comp.knee.value=6;
  comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.15;
  comp.connect(ctx.destination);

    const o=ctx.createOscillator(),g=ctx.createGain();

    o.connect(g); g.connect(comp);
    g.gain.setValueAtTime(0,now+start);
    g.gain.linearRampToValueAtTime(vol,now+start+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,now+start+dur);
    o.start(now+start); o.stop(now+start+dur+0.05);
  }
  if(type==='success'){
    // Acorde dorado: do-mi-sol con shimmer — elegante, corto
    osc(523,'sine',0,0.5,0.28);       // Do5 - fundamental
    osc(659,'sine',0,0.5,0.20);       // Mi5 - tercera
    osc(784,'sine',0,0.45,0.14);      // Sol5 - quinta
    osc(1047,'triangle',0.05,0.35,0.09); // Do6 - brillo
    // Shimmer sutil
    osc(523,'sine',0,0.5,0.06,7);     // ligero detune para riqueza
    osc(659,'sine',0,0.5,0.05,-5);
  } else if(type==='ruta'){
    // Fanfarria ascendente — 4 notas, dramática y potente
    osc(392,'triangle',0,0.25,0.3);     // Sol4
    osc(523,'triangle',0.18,0.28,0.32); // Do5
    osc(659,'triangle',0.35,0.3,0.34);  // Mi5
    osc(784,'triangle',0.52,0.55,0.36); // Sol5
    osc(1047,'sine',0.52,0.5,0.18);     // Do6 brillo
    // Armónico bajo

function extraerCodigoQR(raw){

    if(!cod) return null;

    if(c.length<11) return null; // mínimo 11 caracteres
    if(/[^a-zA-Z0-9]/.test(c)) return null; // sin caracteres especiales

    // Permitir también códigos alfanuméricos mixtos de otras plataformas (min 11)
    if(/^[a-zA-Z0-9]{11,}$/.test(c)) return c.toUpperCase();
    return null;
  }
  try{
    const obj=JSON.parse(raw);
    const campos=['id','codigo','tracking','hash_code'];
    for(const k of campos){
      if(obj[k]){const v=validarCodigo(obj[k]);if(v)return v;}
    }
    const vals=Object.values(obj).filter(v=>typeof v==='string'||typeof v==='number');
    for(const v of vals){const r=validarCodigo(v);if(r)return r;}
  }catch(e){}
  // No es JSON - código directo
  return validarCodigo(raw);
}

  async function procesarFotosGaleria(files){
    const arr=Array.from(files);

    // Comprimir imágenes antes de procesar para mayor velocidad
    // Leer orientación EXIF para corregir fotos rotadas
    async function leerOrientacionEXIF(file){
      return new Promise(res=>{
        const reader=new FileReader();
        reader.onload=e=>{
          const view=new DataView(e.target.result);
          if(view.getUint16(0,false)!==0xFFD8){res(1);return;}
          let offset=2;
          while(offset<view.byteLength){
            if(view.getUint16(offset,false)===0xFFE1){
              if(view.getUint32(offset+4,false)!==0x45786966){res(1);return;}
              const little=view.getUint16(offset+10,false)===0x4949;
              const tags=view.getUint16(offset+14,little);
              for(let i=0;i<tags;i++){
                if(view.getUint16(offset+16+(i*12),little)===0x0112){
                  res(view.getUint16(offset+24+(i*12),little));return;
                }
              }
              res(1);return;
            }
            offset+=2+view.getUint16(offset+2,false);
          }
          res(1);
        };
        reader.onerror=()=>res(1);
        reader.readAsArrayBuffer(file.slice(0,65536));
      });
    }
    async function comprimirImagen(file,maxW=1200){
      return new Promise(async res=>{
        const orientacion=await leerOrientacionEXIF(file);
        const img=new Image();
        const url=URL.createObjectURL(file);
        img.onload=()=>{
          let w=img.width,h=img.height;
          const scale=Math.min(1,maxW/Math.max(w,h));
          w=Math.round(w*scale);h=Math.round(h*scale);
          const canvas=document.createElement('canvas');
          const ctx=canvas.getContext('2d');
          // Corregir orientación EXIF
          if(orientacion>=5&&orientacion<=8){canvas.width=h;canvas.height=w;}
          else{canvas.width=w;canvas.height=h;}
          ctx.save();
          if(orientacion===2){ctx.transform(-1,0,0,1,w,0);}
          else if(orientacion===3){ctx.transform(-1,0,0,-1,w,h);}
          else if(orientacion===4){ctx.transform(1,0,0,-1,0,h);}
          else if(orientacion===5){ctx.transform(0,1,1,0,0,0);}
          else if(orientacion===6){ctx.transform(0,1,-1,0,h,0);}
          else if(orientacion===7){ctx.transform(0,-1,-1,0,h,w);}
          else if(orientacion===8){ctx.transform(0,-1,1,0,0,w);}
          ctx.drawImage(img,0,0,w,h);
          ctx.restore();
          URL.revokeObjectURL(url);
          canvas.toBlob(blob=>{
            res(blob?new File([blob],file.name,{type:'image/jpeg'}):file);
          },'image/jpeg',0.78);
        };
        img.onerror=()=>{URL.revokeObjectURL(url);res(file);};
        img.src=url;
      });

    if(!track) return;
    const nueva=!lintScanRef.current;
    await track.applyConstraints({advanced:[{torch:nueva}]});
    lintScanRef.current=nueva;
    setLintScanOn(nueva);
  }catch(e){}
}

async function iniciarScanner(){
  try{
    if('BarcodeDetector' in window){
      // Flujo nativo: manejamos stream manualmente
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
      if(videoRef.current){
        videoRef.current.srcObject=stream;
        await videoRef.current.play();
        setScannerListo(true);
        iniciarNativo(stream);
      }
    } else {
      // ZXing maneja el stream internamente
      setScannerListo(true);
      iniciarZXing();
    }
  } catch(e){
    setCamError('Sin acceso a cámara: '+e.message+'. Usa modo Manual.');
    setModo('manual');
  }
}

function iniciarNativo(stream){
  const det = new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','code_93','itf','data_matrix','pdf417']});
  const canvas = document.createElement('canvas');
  const timer = setInterval(async()=>{
    if(procesandoRef.current||!videoRef.current||videoRef.current.readyState!==4)return;
    canvas.width=videoRef.current.videoWidth;
    canvas.height=videoRef.current.videoHeight;
    canvas.getContext('2d').drawImage(videoRef.current,0,0);
    try{
      const codes = await det.detect(canvas);
      if(codes.length>0&&!procesandoRef.current){
        procesandoRef.current=true;
        clearInterval(timer);
        detenerScanner();
        procesarCodigo(extraerCodigoQR(codes[0].rawValue.trim()));
      }
    }catch(e){}
  },300);
  scannerRef.current={type:'nativo',timer,stream};
}

function iniciarZXing(){
  // @zxing/library API correcta: BrowserMultiFormatReader
  if(!window.ZXing||!window.ZXing.BrowserMultiFormatReader){
    setCamError('Librería de escaneo no cargada. Usa modo Manual.');
    setModo('manual');
    return;
  }
  try{
    const hints = new Map();
    const codeReader = new window.ZXing.BrowserMultiFormatReader(hints,{delayBetweenScanAttempts:200});
    scannerRef.current={type:'zxing',reader:codeReader};
    const constraints={video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}};
    codeReader.decodeFromConstraints(constraints,videoRef.current,(result,err)=>{
      if(result&&!procesandoRef.current){
        procesandoRef.current=true;
        codeReader.reset();
        detenerScanner();
        procesarCodigo(extraerCodigoQR(result.getText().trim()));
      }
      // err es normal cuando no detecta nada en ese frame, ignorar
    });
  }catch(e){
    setCamError('Error al iniciar scanner: '+e.message+'. Usa modo Manual.');
    setModo('manual');
  }
}

function detenerScanner(){
  if(scannerRef.current){
    if(scannerRef.current.timer) clearInterval(scannerRef.current.timer);
    if(scannerRef.current.reader){ try{scannerRef.current.reader.reset();}catch(e){} }
    if(scannerRef.current.stream) scannerRef.current.stream.getTracks().forEach(t=>t.stop());
    scannerRef.current=null;
  }
  if(videoRef.current&&videoRef.current.srcObject){
    try{videoRef.current.srcObject.getTracks().forEach(t=>t.stop());}catch(e){}
    videoRef.current.srcObject=null;
  }
}

async function procesarCodigo(codigo){
  if(!codigo||!codigo.trim())return;
  const cod=codigo.trim();
  setModo('buscando');
  setResultado({codigo:cod});
  try{
    const {data,error}=await db.from('envios').select('*').eq('codigo',cod).single();
    if(error||!data){
      // Try case-insensitive
      const {data:data2}=await db.from('envios').select('*').ilike('codigo',cod).single();
      if(!data2){
        playSound('error');
        setModo('noexiste');
        setResultado({codigo:cod,msg:'Código no registrado en TransPgso'});
        return;
      }
      return procesarEnvioEncontrado(data2,cod);
    }
    procesarEnvioEncontrado(data,cod);
  }catch(e){
    playSound('error');
    setModo('error');
    setResultado({codigo:cod,msg:'Error de conexión: '+e.message});
  }
}

async function procesarEnvioEncontrado(data,cod){
  if(data.estado==='entregado'||data.estado==='cancelado'){
    playSound('error');
    setModo('terminal');
    setResultado({codigo:cod,msg:'Estado terminal: '+data.estado.toUpperCase()+'. Contacta al admin.',envio:data});
    return;
  }
  try{
    await db.from('envios').update({estado:'en_ruta',mensajero:usuario.nombre,updated_at:new Date().toISOString()}).eq('codigo',data.codigo);
    playSound('ruta');
    const env={...data,estado:'en_ruta',mensajero:usuario.nombre};
    setModo('ok');
    setResultado({codigo:cod,envio:env});
    onScanSuccess(env);
  }catch(e){
    setModo('ok');
    setResultado({codigo:cod,envio:data});
    onScanSuccess(data);
  }
}

<input type="file" id="colecta-foto-inp" accept="image/*" capture="environment" style="display:none">
<script>
(function(){
  // Esperar a que React monte ColectaRider
  var _codigoPendiente = null;
  var inp = document.getElementById('colecta-foto-inp');

  inp.addEventListener('change', function(){
    var file = inp.files[0];
    var codigo = _codigoPendiente;
    if(!file || !codigo) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try {
        var fullBase64 = ev.target.result;
        var base64 = fullBase64.split(',')[1];
        var mediaType = file.type || 'image/jpeg';
        // Llamar a la función de análisis que ya existe en el scope de ColectaRider
        // vía evento custom que ColectaRider escucha
        window.dispatchEvent(new CustomEvent('colecta-foto-ready', {
          detail: { codigo: codigo, base64: base64, mediaType: mediaType }
        }));
      } catch(e) { console.warn('Foto error:', e); }
    };
    reader.readAsDataURL(file);
    inp.value = ''; // reset para permitir misma foto de nuevo
  });

  // Sobrescribir tomarFotoEtiqueta cuando esté disponible
  window.__triggerFotoColecta = function(codigo) {
    _codigoPendiente = codigo;
    inp.click();
  };
})();
</script>
</body>
</html>
